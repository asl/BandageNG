name: Automated Release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 1 * *" # At 12:00 on day-of-month 1

jobs:
  build:
    runs-on: ubuntu-latest
    # Check if the event is not triggered by a fork
    if: ${{ github.repository == 'asl/BandageNG' && github.ref == 'refs/heads/dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Fetch all history for all branches and tags
          fetch-depth: 0

      - name: Get next version
        uses: reecetech/version-increment@2024.10.1
        id: version
        with:
          scheme: calver

      - name: Update version
        run: echo "${{ steps.version.outputs.version }}" > VERSION.txt

      - name: Get changelog
        id: changelog
        env:
          # The snapshot workflow moves the continuous tag to the tip of dev.
          # git describe stops there, so a later cron run logs nothing.
          PREVIOUS_TAG: ${{ steps.version.outputs.current-v-version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CHANGELOG="$(git log "${PREVIOUS_TAG}..HEAD" --pretty=format:'- %s [%an]')"
          write_output() {
            local name="$1"
            local value="$2"
            local delimiter
            delimiter="$(openssl rand -hex 16)"
            {
              echo "${name}<<${delimiter}"
              printf '%s\n' "$value"
              echo "${delimiter}"
            } >> "$GITHUB_OUTPUT"
          }
          write_output content "$(printf 'Changelog:\n%s' "$CHANGELOG")"
          write_output message "$(printf 'Release v%s\n\nChangelog:\n%s' "$VERSION" "$CHANGELOG")"
          write_output body "$(printf 'Auto-generated pull request for version %s.\n\nPlease use **Squash and merge** to include the changelog in the release message.\n\nChangelog:\n%s' "$VERSION" "$CHANGELOG")"

      - name: Display changelog
        env:
          CHANGELOG: ${{ steps.changelog.outputs.content }}
        run: printf '%s\n' "$CHANGELOG"

      - name: Get version
        run: |
          VERSION="$(cat VERSION.txt)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          base: dev
          add-paths: VERSION.txt
          reviewers: asl
          commit-message: ${{ steps.changelog.outputs.message }}
          signoff: false
          branch: v${{ env.VERSION }}
          delete-branch: true
          title: Automated Release v${{ env.VERSION }}
          body: ${{ steps.changelog.outputs.body }}
